[package]
name = "iframe-app"
version.workspace = true
edition.workspace = true

[lib]
name = "iframe_app"
path = "src/lib.rs"

[[bin]]
name = "iframe"
path = "src/main.rs"

[dependencies]
iframe-common = { path = "../iframe-common" }
windows = { workspace = true }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow"] }
egui_plot = "0.37"
tray-icon = "0.24"
global-hotkey = "0.8"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
ferrisetw = "1.2.0"
