[workspace]
resolver = "2"
members = [
    "crates/iframe-common",
    "crates/iframe-hook",
    "crates/iframe-app",
    "tests/d3d11-test-app",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["iFrame contributors"]
license = "MIT"

[workspace.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Performance",
    "Win32_Security",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
codegen-units = 1